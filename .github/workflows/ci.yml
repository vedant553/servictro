# ServiceOS CI (audit INFRA-05): typecheck + unit + integration tests over a
# real PostgreSQL service container, then production builds for API and web.
# Deployment (push to ECR + terraform apply) is a separate promotion job kept
# manual-gated — see the comments at the bottom.

name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API — typecheck, tests, build
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: serviceos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_PG_HOST: 127.0.0.1
      TEST_PG_PORT: "5432"
      JWT_ACCESS_SECRET: ci-access-secret
      JWT_REFRESH_SECRET: ci-refresh-secret
      APP_URL: http://localhost:3000
      STORAGE_DRIVER: local
      MALWARE_SCANNER: signature
      RATE_LIMITING: "on"
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The app role must exist before the API connects (the worker role is
      # created NOLOGIN by the first migration; test global-setup enables its
      # LOGIN). Password matches test/jest.setup.ts — ephemeral CI database.
      - name: Provision database roles
        working-directory: mini-services/serviceos-api
        run: |
          node -e '
          const { Client } = require("pg");
          (async () => {
            const c = new Client({ connectionString: "postgresql://postgres:postgres@127.0.0.1:5432/serviceos_test" });
            await c.connect();
            await c.query("CREATE ROLE serviceos_app LOGIN PASSWORD \'serviceos_app_dev\' NOSUPERUSER NOCREATEDB NOCREATEROLE");
            await c.end();
          })();'

      - name: Typecheck
        working-directory: mini-services/serviceos-api
        run: bunx tsc --noEmit

      - name: Unit tests
        working-directory: mini-services/serviceos-api
        run: bun run test:unit

      - name: Integration tests (real PostgreSQL, RLS active)
        working-directory: mini-services/serviceos-api
        run: bun run test

      - name: Production build
        working-directory: mini-services/serviceos-api
        run: bunx tsc -p tsconfig.build.json

  web:
    name: Web console — typecheck, lint, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck
        run: bunx tsc --noEmit

      - name: Lint
        run: bun run lint

      - name: Production build (standalone)
        run: bun run build

  web-unit:
    name: Web offline-store unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: bun test (offline queue partitioning + purge logic)
        run: bun test src/lib/offline-store.test.ts

