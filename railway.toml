[build]
builder = "nixpacks"
buildCommand = "cd mini-services/serviceos-api && npm install && npx prisma generate && npx tsc -p tsconfig.build.json"

[deploy]
startCommand = "cd mini-services/serviceos-api && npx prisma migrate deploy && node dist/main.js"
healthcheckPath = "/health/ready"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 3
