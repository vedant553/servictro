[phases.setup]
nixPkgs = ["nodejs_22", "nodePackages.npm"]

[phases.install]
cmds = ["npm install --prefix mini-services/serviceos-api --legacy-peer-deps"]
dependsOn = ["setup"]

[phases.build]
cmds = [
  "cd mini-services/serviceos-api && npx prisma generate",
  "cd mini-services/serviceos-api && npx tsc -p tsconfig.build.json"
]
dependsOn = ["install"]

[start]
cmd = "cd mini-services/serviceos-api && npx prisma migrate deploy && node dist/main.js"
